<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f6f1">
  <meta name="description" content="从初代151只宝可梦开始，探索角色、比较能力、试验属性，保存自己的六人队伍。">
  <title>宝可梦发现室 · Poké Discovery</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data/catalog.js" defer></script>
  <script src="js/data/challenges.js" defer></script>
  <script src="js/domain/rules.js" defer></script>
  <script src="js/data/store.js" defer></script>
  <script src="js/ui/lab-effects.js" defer></script>
  <script src="js/ui/app.js" defer></script>
</head>
<body>
  <a href="#main" class="skip-link">跳到主要内容</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./index.html" aria-label="宝可梦发现室首页"><span class="brand-symbol" aria-hidden="true"><i></i></span><span><strong>宝可梦发现室</strong><small>POKÉ DISCOVERY ROOM</small></span></a>
      <nav class="main-nav" aria-label="主导航">
        <button data-view="dex" class="nav-link active">探索图鉴</button>
        <button data-view="lab" class="nav-link">属性实验室</button>
        <button data-view="favorites" class="nav-link">我的收藏 <span id="favorite-count">0</span></button>
        <button data-view="team" class="nav-link">我的队伍 <span id="draft-count">0</span></button>
      </nav>
      <button id="account-button" class="button dark small" data-action="account">登录 / 注册 <span aria-hidden="true">↗</span></button>
    </div>
  </header>
  <main id="main" tabindex="-1"><div class="loading-state">正在整理你的发现室…</div></main>
  <footer class="site-footer"><div><span class="brand-symbol tiny" aria-hidden="true"><i></i></span><span>每一种不同，都值得被发现。</span></div><div><span>课程学习作品 · PokéAPI 公开资料</span><button class="text-button" data-view="about">数据与说明 ↗</button></div></footer>
  <aside id="compare-tray" class="compare-tray" aria-label="已选对比角色" hidden></aside>
  <dialog id="detail-dialog" class="detail-dialog" aria-label="宝可梦详情"><div id="detail-content"></div></dialog>
  <dialog id="compare-dialog" class="compare-dialog" aria-label="基础能力对比"><div id="compare-content"></div></dialog>
  <dialog id="account-dialog" class="account-dialog" aria-label="本地账号"><div id="account-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>请启用 JavaScript 后使用图鉴与个人记录功能。</noscript>
</body>
</html>
